<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Togolande</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1020;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--tx:#f2f5ff;--mu:#9aa6c4;--y:#f5ff00;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:radial-gradient(1100px 600px at 75% -10%,#1b2a52,transparent 60%),var(--bg);color:var(--tx);font:400 16px/1.5 Inter,system-ui,"Segoe UI",sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glass{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
main,footer{position:relative;z-index:1}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);margin:12px auto 0;width:min(1180px,calc(100% - 24px));display:flex;align-items:center;gap:10px;padding:8px 10px 8px 18px;border-radius:999px;z-index:5}
.logo{font-weight:800;display:flex;align-items:center;gap:8px;color:var(--tx);text-decoration:none}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--y);box-shadow:0 0 14px var(--y)}
.links{display:flex;flex:1;justify-content:center;gap:2px;overflow-x:auto;scrollbar-width:none}
.links a{color:var(--mu);text-decoration:none;font-size:14px;padding:6px 11px;white-space:nowrap;border-radius:99px}
.links a:hover{color:var(--tx);background:rgba(255,255,255,.08)}
.nav select,.btn{font:600 14px Inter,system-ui,sans-serif}
.nav select{background:rgba(255,255,255,.08);color:var(--tx);border:1px solid var(--line);border-radius:99px;padding:8px 10px;margin-inline-start:auto}
.btn{border:0;border-radius:99px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-block;color:var(--tx);background:rgba(255,255,255,.12)}
.btn.y{background:var(--y);color:#10140a}
.btn:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.hero{max-width:1180px;margin:0 auto;padding:64px 20px 40px;display:grid;grid-template-columns:1.05fr .95fr;gap:32px;align-items:center;min-height:86vh}
h1{font-size:clamp(34px,5vw,62px);line-height:1.06;margin:0 0 16px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mu);max-width:500px;font-size:18px;margin:0}
.cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{padding:18px 20px}
.card h4{margin:0 0 12px;font-size:14px;color:var(--mu);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:9px;height:120px}
.bars i{flex:1;height:var(--h);background:rgba(255,255,255,.28);border-radius:7px 7px 2px 2px;animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both}
.bars i.on{background:var(--y);box-shadow:0 0 20px rgba(245,255,0,.45)}
@keyframes grow{from{height:0}}
.lbl{display:flex;justify-content:space-around;color:var(--mu);font-size:11px;margin-top:6px}
.dial{width:128px;aspect-ratio:1;margin:auto;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--y) 0 56%,rgba(255,255,255,.1) 0)}
.dial::before{content:"";position:absolute;inset:13px;border-radius:50%;background:#121a2e}
.dial b{position:relative;font-size:28px}
.row{display:flex;justify-content:space-between;align-items:center;margin:11px 0;font-size:14px}
.sw{width:44px;height:25px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;transition:background .3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .3s}
.sw.on{background:var(--y)}.sw.on::after{left:22px;background:#10140a}
.mods{max-width:1180px;margin:0 auto;padding:30px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;scroll-margin-top:90px}
.mod{padding:22px 12px;text-align:center;color:var(--tx);text-decoration:none;transition:transform .3s,border-color .3s}
.mod:hover{transform:translateY(-6px);border-color:var(--y)}
.mod span{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 10px;border-radius:50%;background:rgba(255,255,255,.1);font-size:22px}
.mod:first-child span{background:var(--y)}
.world{position:relative;min-height:125vh;margin-top:70px;overflow:hidden}
.world .map{position:absolute;left:0;top:110px;width:100%;height:calc(100% - 110px);-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
.rg{font:600 5.4px Inter,system-ui,sans-serif;fill:#dbe7ff;stroke:#0a1020;stroke-width:1.6px;paint-order:stroke;text-anchor:middle;dominant-baseline:middle}
.rg.t{fill:#f5ff00;font-size:6.2px}
.world h2{position:relative;text-align:center;font-size:clamp(26px,4vw,46px);padding:90px 20px 0;margin:0;letter-spacing:-.01em}
.arc{fill:none;stroke:#f5ff00;stroke-width:1.6;stroke-dasharray:6 6;animation:dash 3s linear infinite}
@keyframes dash{to{stroke-dashoffset:-48}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.2s ease-out infinite}
@keyframes pl{to{transform:scale(4.5);opacity:0}}
#post{position:relative;z-index:1}
.sec{max-width:1180px;margin:0 auto;padding:48px 20px}
.sec h2,.band h2{font-size:clamp(26px,3.4vw,40px);line-height:1.12;margin:0 0 10px;letter-spacing:-.01em}
.lead{color:var(--mu);margin:0 0 22px;max-width:520px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.card2{padding:14px 14px 18px;color:var(--tx);text-decoration:none;display:block;transition:transform .3s,border-color .3s}
.card2:hover{transform:translateY(-5px);border-color:var(--y)}
.card2 h3{margin:14px 6px 6px;font-size:19px}.card2 p{margin:0 6px 12px;color:var(--mu);font-size:14px}
.sector b{display:block;margin:12px 6px 0}.sector small{display:block;margin:0 6px;color:var(--mu)}
.pic{position:relative;overflow:hidden;border-radius:18px;display:grid;place-items:center;background:radial-gradient(circle at 80% 15%,rgba(255,255,255,.4),transparent 45%),linear-gradient(135deg,var(--a),var(--b))}
.pic span{font-size:52px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.more{color:var(--y);text-decoration:none;font-weight:600;font-size:14px;margin-inline:6px}
.find{display:grid;grid-template-columns:auto 1fr 1fr 2fr auto;gap:10px;align-items:center;padding:16px 20px}
.find select,.find input,#ft input{background:rgba(255,255,255,.08);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font:inherit;min-width:0}
.find option{color:#000}
.band{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;padding:34px;background:linear-gradient(120deg,rgba(40,70,140,.38),rgba(255,255,255,.05))}
.band.cs{grid-template-columns:.9fr 1.1fr;padding:18px 34px 18px 18px}
.track{padding:20px}.trh{display:flex;justify-content:space-between;margin-bottom:14px}
.badge{font-style:normal;font-size:12px;font-weight:600;background:var(--y);color:#10140a;border-radius:99px;padding:3px 10px}
.track ol{list-style:none;margin:0;padding:0}
.track li{display:grid;grid-template-columns:28px 1fr;column-gap:12px;padding-bottom:16px}
.track li i{grid-row:span 2;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-style:normal}
.track li.ok i{background:var(--y);border-color:var(--y);color:#10140a}
.track li small{color:var(--mu)}
.stat{padding:20px;text-align:center}.stat b{display:block;font-size:30px;color:var(--y)}.stat span{color:var(--mu);font-size:14px}
.quote{margin:0;padding:24px;font-size:18px}
.who{display:flex;gap:12px;align-items:center;margin-top:16px;font-size:14px}.who i{width:42px;height:42px;border-radius:50%;background:var(--y);color:#10140a;display:grid;place-items:center;font-style:normal;font-weight:800}.who small{display:block;color:var(--mu)}
.tag{color:var(--y);font-weight:600;font-size:13px}
.faq{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.faq details{padding:14px 18px;margin-bottom:10px;border-radius:18px}.faq summary{cursor:pointer;font-weight:600}.faq p{color:var(--mu);margin:10px 0 0;font-size:14px}
.help{padding:26px;text-align:center}.help span{font-size:38px}.help p{color:var(--mu)}
#ft{max-width:1180px;margin:0 auto;padding:30px 20px calc(30px + env(safe-area-inset-bottom,0px));color:var(--mu);font-size:14px}
.fgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.3fr;gap:24px;padding:28px}
.fgrid b{display:block;color:var(--tx);margin-bottom:8px}.fgrid a:not(.logo){display:block;color:var(--mu);text-decoration:none;margin:5px 0}.fgrid a:not(.logo):hover{color:var(--y)}
.fgrid form{display:flex;gap:8px}.copy{text-align:center;margin:18px 0 0}
@media(max-width:900px){.find,.band,.band.cs,.faq,.fgrid{grid-template-columns:1fr}}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding-top:44px;min-height:0}.links{display:none}}
@media(max-width:560px){.nav .btn:not(.y){display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<meta name="theme-color" content="#0a1020"><style>/* Thème science-fiction / iTech : s’ajoute à style.css et aux styles de l’accueil */
:root{--cy:#35e0ff;scrollbar-width:thin;scrollbar-color:rgba(245,255,0,.4) transparent}
::selection{background:var(--y);color:#10140a}
body{font-family:Inter,system-ui,"Segoe UI",sans-serif}
h1,h2,h3,.price{font-family:"Space Grotesk",Inter,system-ui,sans-serif;letter-spacing:-.01em}
.logo,.stat b,.dial b,.badge,.ticker{font-family:Orbitron,"Space Grotesk",system-ui,sans-serif}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 4px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5))}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.22em;pointer-events:none}
.ic.v{color:var(--y);width:1em;height:1em;margin-inline-start:3px}
.logo{letter-spacing:.06em}.logo .lg{width:22px;height:22px;color:var(--y);filter:drop-shadow(0 0 8px var(--y));animation:spin 14s linear infinite}
.btn,.tabs button{display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .3s,background .3s}
.btn:hover,.tabs button:hover{transform:translateY(-2px)}
.btn.y,.tabs button.on{box-shadow:0 0 0 1px rgba(245,255,0,.55),0 0 24px rgba(245,255,0,.3)}
.btn.y::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s;pointer-events:none}
.btn.y:hover::after{transform:translateX(120%)}
:is(.card,.card2,.mod,.stat,.band,.help,.track,.find,.quote){position:relative}
:is(.card,.card2,.mod,.stat,.band,.help,.track,.find,.quote)::before,:is(.card,.card2,.mod,.stat,.band,.help,.track,.find,.quote)::after{content:"";position:absolute;width:16px;height:16px;border:1.5px solid var(--y);opacity:.35;transition:opacity .3s,width .3s,height .3s;pointer-events:none}
:is(.card,.card2,.mod,.stat,.band,.help,.track,.find,.quote)::before{top:10px;left:10px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
:is(.card,.card2,.mod,.stat,.band,.help,.track,.find,.quote)::after{bottom:10px;right:10px;border-left:0;border-top:0;border-radius:0 0 8px 0}
:is(.card,.card2,.mod,.stat,.band,.help,.track,.find,.quote):hover::before,:is(.card,.card2,.mod,.stat,.band,.help,.track,.find,.quote):hover::after{opacity:1;width:28px;height:28px}
.card2:hover,.mod:hover,.stat:hover,.band:hover{border-color:rgba(245,255,0,.5);box-shadow:0 0 34px rgba(245,255,0,.14),0 12px 40px rgba(0,0,0,.4)}
.mod:first-child span{color:#10140a}
.hero .cards{position:relative}
.hero .cards::before,.hero .cards::after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:-1}
.hero .cards::before{inset:-9%;border:1px dashed rgba(245,255,0,.28);animation:spin 70s linear infinite}
.hero .cards::after{inset:-17%;border:1px solid rgba(53,224,255,.14);border-top-color:rgba(53,224,255,.65);animation:spin 38s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.ticker{overflow:hidden;white-space:nowrap;margin-top:16px;border-block:1px solid var(--line);background:rgba(10,16,32,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.ticker>div{display:inline-flex;gap:38px;padding:10px 19px;animation:tick 45s linear infinite;will-change:transform}
.ticker span{display:inline-flex;align-items:center;gap:9px}.ticker .ic{color:var(--y)}
.live{width:8px;height:8px;border-radius:50%;background:#3dff9a;box-shadow:0 0 10px #3dff9a;animation:blink 1.6s ease-in-out infinite}
@keyframes tick{to{transform:translateX(-50%)}}@keyframes blink{50%{opacity:.25}}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
.burger{display:none;place-items:center;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:var(--tx);cursor:pointer}
.hud-note{display:flex;gap:8px;align-items:center;font-size:13px;margin:0 0 14px}.hud-note .ic{color:var(--y)}
.tabbar{display:flex;gap:4px;padding:6px;margin-bottom:16px;border-radius:99px;overflow-x:auto;scrollbar-width:none}
@media(max-width:900px){
 .burger{display:grid}
 .links{display:none!important;position:absolute;left:0;right:0;top:calc(100% + 8px);flex-direction:column;align-items:stretch;padding:10px;background:rgba(14,22,44,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px}
 .links.open{display:flex!important}
 .links a{display:flex;align-items:center;gap:10px;padding:13px 14px;font-size:16px}
 .hero .cards::before,.hero .cards::after{display:none}
}
@media(max-width:760px){
 .app .tabbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:12;margin:0;border-radius:22px;justify-content:space-around;overflow:visible;box-shadow:0 10px 40px rgba(0,0,0,.55);background:rgba(14,22,44,.9)}
 .app .tabbar button{flex:1;min-width:0;flex-direction:column;gap:3px;padding:8px 2px;font-size:10px;background:none;border-radius:14px}
 .app .tabbar button.on{background:var(--y);color:#10140a}
 .app .tabbar button .ic{font-size:21px}
 .app .wrap{padding-bottom:104px}.app .fab{bottom:calc(88px + env(safe-area-inset-bottom,0px))}.app .assist{bottom:calc(142px + env(safe-area-inset-bottom,0px))}.app #who{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style></head><body>

 for(var i=0;i<N;i++){var p=ps[i];p.x=(p.x+p.vx*16+1)%1;p.y=(p.y+p.vy*16+1)%1;var X=p.x*W,Y=p.y*H;g.fillRect(X,Y,1.6,1.6);
